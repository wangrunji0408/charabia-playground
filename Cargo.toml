[package]
name = "charabia-playground"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
charabia = { version = "0.9", default-features = false, features = [
  "chinese",                # jieba-rs patched to remove zstd dependency
  "hebrew",
  "thai",
  "greek",
  "khmer",
  "vietnamese",
  "swedish-recomposition",
  "turkish",
  "german-segmentation",
  # Excluded (lindera -> zstd-sys, C lib not WASM-compatible):
  #   "japanese", "korean"
] }
console_error_panic_hook = "0.1"

[patch.crates-io]
jieba-rs = { path = "deps/jieba-rs/jieba" }

[profile.release]
opt-level = "s"
lto = true
